<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Roll Overlay</title>
  <!-- Cinzel (plaque typeface). Self-hosted first so the overlay never depends on a CDN;
       the Google Fonts link stays as a fallback. Either way it degrades to serif. -->
  <link href="/assets/fonts/cinzel.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Shared plaque zone styles + renderer (same code the customizer edits with → WYSIWYG). -->
  <link href="/assets/shared/plaque.css" rel="stylesheet">
  <script src="/assets/shared/plaque-render.js"></script>
  <style>
    :root {
      --gold: #c79a4b;
      --gold-light: #e6c87f;
      --gold-deep: #a47a32;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: 'Cinzel', serif; }
    /* 3D dice canvas fills the screen; the plaque result sits on top. */
    #dice { position: fixed; inset: 0; z-index: 1; }
    #dice canvas { width: 100% !important; height: 100% !important; }
    #stage { position: fixed; inset: 0; z-index: 2; display: flex;
      align-items: center; justify-content: center; pointer-events: none; }

    /* ── Result plaque ───────────────────────────────────────────────────────────
       The plaque content (art/background + zones) is rendered from the player's saved
       config by the shared BRPlaque renderer (zone visuals come from plaque.css).
       Only the framing, entrance animation, and whole-plaque crit/fumble glow live here. */
    .plaque {
      position: relative;
      height: min(80vh, 560px);
      aspect-ratio: 398 / 440;
      container-type: inline-size;
      filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.55));
      transform: translateY(34px) scale(0.95); opacity: 0;
      transition: transform 0.4s cubic-bezier(.2,.9,.25,1.2), opacity 0.4s ease;
    }
    .plaque.show { transform: translateY(0) scale(1); opacity: 1; }
    .plaque.crit {
      filter: drop-shadow(0 0 7cqw rgba(255, 190, 0, 0.6)) drop-shadow(0 12px 40px rgba(0, 0, 0, 0.5));
    }
    .plaque.fumble {
      filter: drop-shadow(0 0 6cqw rgba(255, 60, 40, 0.45)) drop-shadow(0 12px 40px rgba(0, 0, 0, 0.5));
    }
    .plaque.fumble.show { animation: shake 0.5s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)}
      40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)} }
    /* total "bump" when modifiers slam into the raw result */
    @keyframes totalBump { 0%{transform:scale(1)} 35%{transform:scale(1.3)} 100%{transform:scale(1)} }
    .zone[data-id="total"] .zc.bump { animation: totalBump .42s cubic-bezier(.2,.8,.2,1); }

    #status { position: fixed; top: 6px; left: 8px; z-index: 3; font-size: 11px; color: #888;
      font-family: monospace; opacity: 0.5; }
  </style>
</head>
<body>
  <div id="dice"></div>
  <div id="stage"></div>
  <div id="status">connecting…</div>

  <script type="module">
  /* ─────────────────────────────────────────────────────────────────────────
     OVERLAY CONFIG — the DEFAULT dice look (used when a roll carries no per-player
     style). Per-player styles are set on the customize page and arrive on each roll
     as `roll.style`; styleToConfig() below maps them onto the engine.
     Materials: "glass" (translucent), "plastic", "metal", "wood", "none".
     Textures/colorsets: see /assets/dice-manifest.json (built-ins + your custom ones).
     ───────────────────────────────────────────────────────────────────────── */
  const CONFIG = {
    enable3d: true,            // master switch; falls back to the plaque-only overlay if false/unavailable
    theme_material: 'glass',   // translucent dice by default
    theme_texture: 'marble',   // surface texture
    theme_colorset: 'white',   // base color palette
    scale: 100,                // dice size (baseScale)
    strength: 1.6,             // toss strength
    shadows: true,
    displayMs: 4200,           // how long the result plaque stays up
    settleTimeoutMs: 6000,     // safety: proceed even if physics never reports done
  };

  // Assets are served locally from /assets/ (vendored). The dice engine + confetti
  // load local-first and fall back to the CDN only if the local copy is missing —
  // so a CDN outage never breaks the overlay. (Custom textures only exist in the
  // locally-built bundle; the CDN fallback gives built-in textures only.)
  const ASSET_PATH = '/assets/';
  const LOCAL_ENGINE = '/assets/dice-box/dice-box.bundle.js';
  const CDN = 'https://cdn.jsdelivr.net/npm/@3d-dice/dice-box-threejs@0.0.12';
  const SUPPORTED_SIDES = new Set([4, 6, 8, 10, 12, 20, 100]);

  const params = new URLSearchParams(location.search);
  const room = (location.pathname.match(/\/room\/([^/]+)\//) || [])[1] || params.get('room');
  const wantPlayer = params.get('player');     // per-player overlay filter
  const DEMO = params.get('demo');             // landing-page demo: parent drives rolls via postMessage
  const statusEl = document.getElementById('status');
  const stage = document.getElementById('stage');
  const I18N = {
    en: {
      adv: 'Advantage',
      dis: 'Disadvantage',
      crit: 'Critical hit!',
      fumble: 'Fumble',
      someone: 'Someone',
      statusConnecting: 'connecting…',
      statusLive: 'live',
      statusMissingRoom: 'missing room id',
      statusReconnecting: 'reconnecting…',
      previewWho: 'Preview',
      previewCheck: 'Check',
      previewAttack: 'Fire Bolt',
    },
    es: {
      adv: 'Ventaja',
      dis: 'Desventaja',
      crit: '¡Crítico!',
      fumble: 'Pifia',
      someone: 'Alguien',
      statusConnecting: 'conectando…',
      statusLive: 'en directo',
      statusMissingRoom: 'falta el id de la sala',
      statusReconnecting: 'reconectando…',
      previewWho: 'Vista previa',
      previewCheck: 'Prueba',
      previewAttack: 'Rayo de fuego',
    },
  };
  function detectLang() {
    let saved = '';
    try { saved = localStorage.getItem('ovr_lang') || localStorage.getItem('br_lang') || ''; } catch {}
    if (saved === 'en' || saved === 'es') return saved;
    return (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
  }
  const lang = detectLang();
  const t = (key) => ((I18N[lang] || I18N.en)[key] || I18N.en[key] || key);
  document.documentElement.lang = lang;
  if (statusEl) statusEl.textContent = t('statusConnecting');

  // ── optional libraries (3D dice + particles), loaded with graceful fallback ──
  let Box = null;       // dice-box-threejs instance, or null → plaque-only
  let confetti = null;  // canvas-confetti, or null → no particles

  // Import a module local-first, falling back to the CDN URL if the local copy fails.
  // Returns { mod, usedCdn } so callers can adjust paths (e.g. assetPath) accordingly.
  async function importLocalFirst(localUrl, cdnUrl, label) {
    try { return { mod: await import(localUrl), usedCdn: false }; }
    catch (e) {
      console.warn(`[overlay] local ${label} unavailable, trying CDN`, e);
      return { mod: await import(cdnUrl), usedCdn: true };
    }
  }

  async function initDice() {
    if (!CONFIG.enable3d) return;
    try {
      const { mod, usedCdn } = await importLocalFirst(LOCAL_ENGINE, `${CDN}/dist/dice-box-threejs.es.js`, 'dice engine');
      const DiceBox = mod.default;
      Box = new DiceBox('#dice', {
        // Local assetPath with the local engine; CDN public/ if we fell back.
        assetPath: usedCdn ? `${CDN}/public/` : ASSET_PATH,
        sounds: false,
        shadows: CONFIG.shadows,
        baseScale: CONFIG.scale,
        strength: CONFIG.strength,
        theme_material: CONFIG.theme_material,
        theme_texture: CONFIG.theme_texture,
        theme_colorset: CONFIG.theme_colorset,
      });
      await Box.initialize();
      console.log('[overlay] 3D dice ready');
    } catch (e) {
      Box = null;
      console.warn('[overlay] 3D dice unavailable — using plaque-only overlay', e);
    }
  }
  async function initConfetti() {
    try { const mod = await import('https://esm.sh/canvas-confetti@1.9.3'); confetti = mod.default; } catch {}
  }

  // Map a per-player style (from roll.style) onto dice-box-threejs config. With custom
  // colors we use theme_customColorset (which also carries texture+material); otherwise
  // a named colorset + texture + material. Missing fields fall back to CONFIG defaults.
  function styleToConfig(style) {
    const s = style || {};
    const texture = s.texture != null ? s.texture : CONFIG.theme_texture;
    const material = s.material != null ? s.material : CONFIG.theme_material;
    const hasCustomColors = s.foreground || s.background || s.edge;
    if (hasCustomColors) {
      return {
        theme_texture: texture,
        theme_material: material,
        theme_customColorset: {
          foreground: s.foreground || '#ffffff',
          background: s.background || s.foreground || '#cccccc',
          outline: s.edge || s.background || 'black',
          edge: s.edge || s.background || '',
          texture,
          material,
        },
      };
    }
    return {
      theme_customColorset: null,
      theme_colorset: s.colorset || CONFIG.theme_colorset,
      theme_texture: texture,
      theme_material: material,
    };
  }

  // ── per-style texture cache ──────────────────────────────────────────────────
  // Resolving a style runs the engine's loadTheme → ImageLoader (loads the texture
  // image) and produces a `colorData` object holding the loaded texture. We cache
  // that colorData per distinct style so repeat rolls just re-apply it (no reload),
  // and the overlay pre-warms every known player's style on connect. A style change
  // yields a new key → it's re-resolved (re-cached) the next time it's needed.
  const styleCache = new Map();        // styleKey -> resolved colorData
  const STYLE_CACHE_MAX = 64;
  function styleKey(style) {
    const s = style || {};
    return JSON.stringify([s.texture || '', s.material || '', s.colorset || '',
      s.foreground || '', s.background || '', s.edge || '']);
  }

  // Serialize everything that touches the engine (warming vs. rolling) so their
  // async steps never interleave on the single shared DiceBox/DiceFactory.
  let engineLock = Promise.resolve();
  function withEngine(fn) {
    const p = engineLock.then(fn, fn);
    engineLock = p.catch(() => {});
    return p;
  }

  // Resolve+cache a style if needed, then make the dice use it. Fast path: a cache
  // hit just re-applies the stored colorData (no network, no engine re-resolve).
  function applyStyle(style) {
    return withEngine(async () => {
      if (!Box) return;
      const key = styleKey(style);
      const cached = styleCache.get(key);
      if (cached) {
        try { Box.DiceFactory.applyColorSet(cached); Box.colorData = cached; }
        catch (e) { console.warn('[overlay] applyColorSet failed', e); }
        return;
      }
      // Miss: resolve via the engine (clear its name-keyed memo first so the texture
      // actually re-resolves), then capture and cache the loaded colorData.
      try { if (Box.DiceColors) Box.DiceColors.colorsets = {}; } catch {}
      try {
        await Box.updateConfig(styleToConfig(style));
        if (Box.colorData) {
          styleCache.set(key, Box.colorData);
          while (styleCache.size > STYLE_CACHE_MAX) styleCache.delete(styleCache.keys().next().value);
        }
      } catch (e) { console.warn('[overlay] style resolve failed', e); }
    });
  }

  // Pre-load (and re-load on change) every known player's dice textures so the first
  // roll for each player is instant. Polls /styles; prunes cache to the current set.
  let lastStylesJson = '';
  async function warmStyles() {
    if (!Box || !room) return;
    try {
      const r = await fetch('/room/' + room + '/styles');
      if (!r.ok) return;
      const txt = await r.text();
      if (txt === lastStylesJson) return;       // unchanged since last poll
      lastStylesJson = txt;
      const d = JSON.parse(txt);
      const styles = [d.defaultStyle, ...Object.values(d.styles || {})].filter(Boolean);
      const keep = new Set([styleKey(null), ...styles.map(styleKey)]);
      for (const k of [...styleCache.keys()]) if (!keep.has(k)) styleCache.delete(k); // drop updated/removed
      for (const s of styles) if (!styleCache.has(styleKey(s))) await applyStyle(s);   // warm new ones
    } catch {}
  }

  // ── notation builder: turn parsed dice into a PREDETERMINED roll string ──────
  // e.g. [{sides:'20',value:13}] → "1d20@13";  two d20s → "2d20@13,8".
  function notationFromDice(dice) {
    const groups = new Map(); // sides -> [values] (preserves a stable term order)
    for (const d of dice) {
      const s = Number(d.sides);
      if (!SUPPORTED_SIDES.has(s) || !Number.isFinite(Number(d.value))) continue;
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(Number(d.value));
    }
    if (!groups.size) return null;
    const terms = [], values = [];
    for (const [sides, vals] of groups) { terms.push(`${vals.length}d${sides}`); values.push(...vals); }
    return `${terms.join('+')}@${values.join(',')}`;
  }

  // What dice to physically roll for this event. Advantage/disadvantage rolls
  // BOTH d20s (so you see the pair) and we mark which one won.
  function rollPlan(roll) {
    if ((roll.mode === 'advantage' || roll.mode === 'disadvantage') &&
        roll.d20 && Array.isArray(roll.d20.values) && roll.d20.values.length === 2) {
      const [a, b] = roll.d20.values.map(Number);
      return { notation: `2d20@${a},${b}`, pair: { a, b, kept: roll.d20.keptIndex === 1 ? b : a, keptIndex: roll.d20.keptIndex } };
    }
    return { notation: notationFromDice(roll.dice || []), pair: null };
  }

  // ── plaque result card ─────────────────────────────────────────────────────
  const fmtMod = (m) => (m > 0 ? `+ ${m}` : m < 0 ? `− ${Math.abs(m)}` : '');

  // Split "Fire Bolt: 1d20 + 7" → { name:"Fire Bolt", expr:"1d20 + 7" }.
  function splitFormula(f) {
    const s = (f || '').trim();
    const i = s.indexOf(':');
    if (i > 0) return { name: s.slice(0, i).trim(), expr: s.slice(i + 1).trim() };
    return { name: '', expr: s };
  }
  // Initials for the portrait placeholder when no avatar is available.
  function initials(name) {
    const parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  // Stable hue per name so the placeholder colour is consistent for a given player.
  function hueFor(s) { let h = 0; for (const c of (s || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

  // Render the coloured initials disc (the portrait fallback). Replaces any <img>.
  function setInitials(portrait, who) {
    portrait.classList.add('placeholder');
    portrait.style.setProperty('--hue', hueFor(who));
    portrait.textContent = initials(who);
  }

  function buildBreakdown(roll, plan) {
    if (plan && plan.pair) {
      const { a, b, keptIndex } = plan.pair;
      const aCls = keptIndex === 0 ? 'keep' : 'drop';
      const bCls = keptIndex === 1 ? 'keep' : 'drop';
      const mod = roll.modifier ? ` <span class="mod">${fmtMod(roll.modifier)}</span>` : '';
      return `<span class="${aCls}">${a}</span> · <span class="${bCls}">${b}</span>${mod}`;
    }
    const vals = (roll.dice || []).map((d) => d.value).filter((v) => Number.isFinite(Number(v)));
    if (!vals.length) return '';
    const dicePart = vals.join(' + ');
    const mod = roll.modifier ? ` <span class="mod">${fmtMod(roll.modifier)}</span>` : '';
    return `${dicePart}${mod}`;
  }

  // ── plaque config (per player) — fetched from the relay, cached + polled ────────
  // The plaque is rendered by the shared BRPlaque renderer from the player's saved
  // config (template/art, zones, colors, background), so it matches the customizer.
  const templatesById = {};                     // templateId -> { id, art, colors, zones }
  const plaqueCache = { plaques: {}, defaultPlaque: null };
  let lastPlaqueJson = '';
  // Hardcoded fallback so the plaque renders even with no relay (DEMO) or before fetch.
  const BUILTIN_PLAQUE = {
    templateId: 'arcane', art: '/assets/plaque_templates/arcane-plaque.png',
    colors: { accent: '#ffd24a', badge: '#2e7d32', name: '#e6c87f' },
    zones: [
      { id: 'portrait',  kind: 'image', cx: 50, cy: 21.6, w: 21.5, coef: 0,     fs: 1, align: 'center', colorKey: null,     visible: true },
      { id: 'name',      kind: 'text',  cx: 50, cy: 39.8, w: 70,   coef: 0.034, fs: 1, align: 'center', colorKey: 'name',   visible: true },
      { id: 'badge',     kind: 'pill',  cx: 50, cy: 51.5, w: 0,    coef: 0.024, fs: 1, align: 'center', colorKey: 'badge',  visible: true },
      { id: 'total',     kind: 'text',  cx: 50, cy: 62.8, w: 50,   coef: 0.205, fs: 1, align: 'center', colorKey: 'accent', visible: true },
      { id: 'rname',     kind: 'text',  cx: 50, cy: 75.0, w: 82,   coef: 0.041, fs: 1, align: 'center', colorKey: 'accent', visible: true },
      { id: 'breakdown', kind: 'text',  cx: 50, cy: 83.2, w: 60,   coef: 0.031, fs: 1, align: 'center', colorKey: 'name',   visible: true },
      { id: 'tag',       kind: 'pill',  cx: 50, cy: 91.2, w: 0,    coef: 0.028, fs: 1, align: 'center', colorKey: 'accent', visible: true },
    ],
  };
  async function loadTemplates() {
    if (!room) return;
    try { const r = await fetch('/room/' + room + '/templates'); if (!r.ok) return;
      const d = await r.json(); (d.templates || []).forEach((tp) => { templatesById[tp.id] = tp; }); } catch {}
  }
  async function loadPlaques() {
    if (!room) return;
    try {
      const r = await fetch('/room/' + room + '/plaque'); if (!r.ok) return;
      const txt = await r.text(); if (txt === lastPlaqueJson) return; lastPlaqueJson = txt;
      const d = JSON.parse(txt); plaqueCache.plaques = d.plaques || {}; plaqueCache.defaultPlaque = d.defaultPlaque || null;
    } catch {}
  }
  function templateArt(id) { const tp = templatesById[id]; return tp ? tp.art : (id === BUILTIN_PLAQUE.templateId ? BUILTIN_PLAQUE.art : null); }
  function plaqueConfigFor(roll) {
    const id = roll && roll.playerid;
    return (id && plaqueCache.plaques[id]) || plaqueCache.defaultPlaque ||
      templatesById.arcane && { templateId: 'arcane', colors: templatesById.arcane.colors, zones: templatesById.arcane.zones, background: null } ||
      BUILTIN_PLAQUE;
  }
  // roll → the data object BRPlaque.paint fills the zones with (same shape the editor uses).
  function rollToData(roll, plan) {
    const sf = splitFormula(roll.formula);
    return {
      total: (roll.total ?? '?'),
      breakdown: buildBreakdown(roll, plan),   // HTML (keep/dropped-die spans) — paint uses innerHTML
      name: roll.who || t('someone'),
      rname: sf.name || sf.expr || '',
      badge: roll.mode === 'advantage' ? 'advantage' : roll.mode === 'disadvantage' ? 'disadvantage' : null,
      tag: roll.isCrit ? 'crit' : roll.isFumble ? 'fumble' : null,
      cls: roll.isCrit ? 'crit' : roll.isFumble ? 'fumble' : '',
      portraitImg: roll.avatar || null,
    };
  }
  const paintDict = () => ({ adv: t('adv'), dis: t('dis'), crit_tag: t('crit'), fumble_tag: t('fumble') });

  // ── room settings (display time, confetti) — fetched + polled; hideGm/sound TBD ──
  let settings = null, lastSettingsJson = '';
  async function loadSettings() {
    if (!room) return;
    try { const r = await fetch('/room/' + room + '/settings'); if (!r.ok) return;
      const txt = await r.text(); if (txt === lastSettingsJson) return; lastSettingsJson = txt;
      settings = (JSON.parse(txt).settings) || null; } catch {}
  }
  const displayMs = () => (settings && Number.isFinite(settings.displaySeconds)) ? settings.displaySeconds * 1000 : CONFIG.displayMs;

  function showCard(roll, plan) {
    const cfg = plaqueConfigFor(roll);
    const zones = (cfg && cfg.zones) || [];
    const el = document.createElement('div');
    el.className = 'plaque' + (roll.isCrit ? ' crit' : roll.isFumble ? ' fumble' : '');
    el._zones = zones; // for resize recompute
    if (window.BRPlaque && zones.length) {
      BRPlaque.build(el, zones, { editable: false });
      BRPlaque.layout(el, zones);
      BRPlaque.applyArt(el, { art: templateArt(cfg.templateId), frame: cfg.frame, background: cfg.background });
      BRPlaque.applyColors(el, cfg.colors || {}, zones);
      BRPlaque.paint(el, zones, rollToData(roll, plan), paintDict());
    }
    stage.appendChild(el);
    if (window.BRPlaque && zones.length) BRPlaque.recomputeFont(el, zones); // el is in the DOM → has size
    requestAnimationFrame(() => el.classList.add('show'));
    maybeBump(el, roll);
    return el;
  }

  // When a roll has a net modifier, the plaque first shows the RAW dice result, then the
  // breakdown flies up into the total and the number bumps to the final value.
  function countUp(node, from, to, dur, onDone) {
    const start = performance.now(), diff = to - from;
    const step = (now) => {
      const k = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - k, 3); // easeOutCubic
      node.textContent = String(Math.round(from + diff * e));
      if (k < 1) requestAnimationFrame(step); else { node.textContent = String(to); if (onDone) onDone(); }
    };
    requestAnimationFrame(step);
  }
  function maybeBump(el, roll) {
    const mod = Number(roll.modifier) || 0;
    const final = Number(roll.total);
    if (!mod || !Number.isFinite(final)) return;     // nothing to bump
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const totalEl = el.querySelector('.zone[data-id="total"]');
    const totalZc = totalEl && totalEl.querySelector('.zc');
    if (!totalZc) return;
    const base = final - mod;                          // raw dice sum (before modifiers)
    totalZc.textContent = String(base);                // show the raw result first
    const bd = el.querySelector('.zone[data-id="breakdown"]');
    setTimeout(() => {
      // fly the breakdown up into the total
      if (bd && getComputedStyle(bd).display !== 'none') {
        const tr = totalEl.getBoundingClientRect(), br = bd.getBoundingClientRect();
        const dx = (tr.left + tr.width / 2) - (br.left + br.width / 2);
        const dy = (tr.top + tr.height / 2) - (br.top + br.height / 2);
        bd.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1), opacity .5s ease';
        bd.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px) scale(.55)`;
        bd.style.opacity = '0';
      }
      // count up to the final value, then pop the number
      countUp(totalZc, base, final, 480, () => {
        totalZc.classList.remove('bump'); void totalZc.offsetWidth; totalZc.classList.add('bump');
      });
    }, 650);
  }

  function fireParticles(roll) {
    if (!confetti) return;
    if (settings && settings.confetti === false) return; // room setting: critical celebration off
    if (roll.isCrit) {
      const gold = ['#ffd24a', '#ffb300', '#fff3c4', '#ffffff'];
      confetti({ particleCount: 120, spread: 80, startVelocity: 55, origin: { x: 0.5, y: 0.75 }, colors: gold });
      setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 70, origin: { x: 0, y: 0.9 }, colors: gold }), 120);
      setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 70, origin: { x: 1, y: 0.9 }, colors: gold }), 120);
    } else if (roll.isFumble) {
      confetti({ particleCount: 40, spread: 100, startVelocity: 18, gravity: 1.6, ticks: 120,
        origin: { x: 0.5, y: 0.4 }, colors: ['#ff5050', '#7a0000', '#2a0000'], scalar: 0.9 });
    }
  }

  // ── one-at-a-time roll queue ──────────────────────────────────────────────────
  const queue = [];
  let busy = false;
  function enqueue(roll) { queue.push(roll); if (!busy) drain(); }

  async function drain() {
    busy = true;
    while (queue.length) {
      const roll = queue.shift();
      const plan = rollPlan(roll);
      try {
        if (Box && plan.notation) {
          // Re-theme to the rolling player's style (cached → no texture reload).
          await applyStyle(roll.style);
          Box.clearDice();
          await withTimeout(Box.roll(plan.notation), CONFIG.settleTimeoutMs);
        }
      } catch (e) { console.warn('[overlay] dice roll failed', e); }
      const card = showCard(roll, plan);
      fireParticles(roll);
      await sleep(displayMs());
      card.classList.remove('show');
      await sleep(420);
      card.remove();
      if (Box) { try { Box.clearDice(); } catch {} }
    }
    busy = false;
    // Demo mode: tell the embedding landing page the queue drained so it can pace
    // the next auto-play roll without the queue piling up.
    if (DEMO) { try { parent.postMessage({ type: 'demo-idle' }, location.origin); } catch {} }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const withTimeout = (p, ms) => Promise.race([Promise.resolve(p), sleep(ms)]);

  // ── SSE ───────────────────────────────────────────────────────────────────────
  function connect() {
    if (!room) { statusEl.textContent = t('statusMissingRoom'); return; }
    const es = new EventSource('/room/' + room + '/events');
    es.onopen = () => { statusEl.textContent = t('statusLive'); };
    es.onmessage = (e) => {
      try {
        const roll = JSON.parse(e.data);
        if (wantPlayer && roll.playerid !== wantPlayer) return; // not this player's overlay
        if (roll.ts) statusEl.textContent = t('statusLive') + ' · ' + (Date.now() - roll.ts) + 'ms';
        console.log('[overlay] roll received:', roll.who, roll.formula, '=', roll.total,
          roll.mode && roll.mode !== 'normal' ? '(' + roll.mode + ')' : '', roll.isCrit ? '[CRIT]' : roll.isFumble ? '[FUMBLE]' : '', roll);
        enqueue(roll);
      } catch {}
    };
    es.onerror = () => { statusEl.textContent = t('statusReconnecting'); };
  }

  // ── boot ────────────────────────────────────────────────────────────────────
  await Promise.allSettled([initDice(), initConfetti()]);

  // Plaque configs + templates + room settings (cached; polled so edits land without a reload).
  if (room) {
    loadTemplates(); loadPlaques(); loadSettings();
    setInterval(() => { loadPlaques(); loadSettings(); }, 15000);
  }
  // Keep zone fonts sized to the plaque if the OBS source / window is resized mid-display.
  window.addEventListener('resize', () => {
    const el = stage.querySelector('.plaque');
    if (el && el._zones && window.BRPlaque) BRPlaque.recomputeFont(el, el._zones);
  });

  if (DEMO) {
    // Embedded on the landing page: no room/SSE. The parent page sends rolls via
    // postMessage and we render them through the real pipeline (3D dice + plaque
    // + particles), reporting ready/idle so it can drive buttons + auto-play.
    statusEl.style.display = 'none';
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'demo-roll' && e.data.roll) enqueue(e.data.roll);
    });
    try { parent.postMessage({ type: 'demo-ready' }, location.origin); } catch {}
  } else {
    connect();
    // Pre-warm every known player's dice textures now, then poll so a style edited on
    // the customize page gets re-cached without waiting for that player's next roll.
    if (Box && room) {
      warmStyles();
      setInterval(warmStyles, 15000);
    }
  }

  // ── preview: press keys in a normal tab to test (no Roll20 needed) ───────────
  //   T = normal d20   A = advantage   D = disadvantage   C = crit   F = fumble
  let n = 0;
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (!'tadcf'.includes(k)) return;
    n++;
    const d20 = (v) => ({ sides: '20', value: v, crit: v === 20, fumble: v === 1 });
    if (k === 'a' || k === 'd') {
      const a = 4 + (n * 7) % 17, b = 2 + (n * 11) % 18;
      const kept = k === 'a' ? Math.max(a, b) : Math.min(a, b);
      enqueue({ id: 'k' + n, who: t('previewWho'), formula: `${t('previewCheck')}: 1d20 + 5`, total: kept + 5, modifier: 5,
        mode: k === 'a' ? 'advantage' : 'disadvantage', d20: { values: [a, b], keptIndex: (k === 'a' ? (a >= b ? 0 : 1) : (a <= b ? 0 : 1)) },
        dice: [d20(kept)], isCrit: kept === 20, isFumble: kept === 1, ts: Date.now() });
    } else {
      const v = k === 'c' ? 20 : k === 'f' ? 1 : 2 + (n % 18);
      enqueue({ id: 'k' + n, who: t('previewWho'), formula: `${t('previewAttack')}: 1d20 + 7`, total: v + 7, modifier: 7,
        mode: 'normal', d20: null, dice: [d20(v)], isCrit: v === 20, isFumble: v === 1, ts: Date.now() });
    }
  });
  </script>
</body>
</html>
