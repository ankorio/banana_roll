<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Roll Overlay</title>
  <!-- Cinzel (plaque typeface). Self-hosted first so the overlay never depends on a CDN;
       the Google Fonts link stays as a fallback. Either way it degrades to serif. -->
  <link href="/assets/fonts/cinzel.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Shared plaque zone styles + renderer (same code the customizer edits with → WYSIWYG). -->
  <link href="/assets/shared/plaque.css" rel="stylesheet">
  <script src="/assets/shared/plaque-render.js"></script>
  <style>
    :root {
      --gold: #c79a4b;
      --gold-light: #e6c87f;
      --gold-deep: #a47a32;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: 'Cinzel', serif; }
    /* 3D dice canvas fills the screen; the plaque result sits on top. */
    #dice { position: fixed; inset: 0; z-index: 1; }
    #dice canvas { width: 100% !important; height: 100% !important; }
    /* Centered row of result plaques. New rolls insert at the end and the row stays
       centered; --plaque-h (set per-frame by relayout) shrinks them all to fit. */
    #stage { position: fixed; inset: 0; z-index: 2; display: flex;
      align-items: center; justify-content: center; gap: 1.6vw; pointer-events: none; }

    /* ── Result plaque ───────────────────────────────────────────────────────────
       The plaque content (art/background + zones) is rendered from the player's saved
       config by the shared BRPlaque renderer (zone visuals come from plaque.css).
       Only the framing, entrance animation, and whole-plaque crit/fumble glow live here. */
    .plaque {
      position: relative;
      flex: 0 0 auto;
      height: var(--plaque-h, min(80vh, 560px));
      aspect-ratio: 398 / 440;
      container-type: inline-size;
      filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.55));
      transform: translateY(34px) scale(0.95); opacity: 0;
      /* transform+opacity drive both the entrance AND the FLIP reflow (JS slides each
         plaque from its old box to the new one). Height snaps instantly so it doesn't
         fight the FLIP measurement. */
      transition: transform 0.42s cubic-bezier(.2,.9,.25,1.2), opacity 0.4s ease;
    }
    .plaque.show { transform: translateY(0) scale(1); opacity: 1; }
    /* Exit: lift away + shrink + fade. The plaque is pulled from flow (position:fixed) by
       dismissCard() so the remaining plaques slide in underneath at the same time. */
    .plaque.leaving { transform: translateY(-26px) scale(0.8); opacity: 0; pointer-events: none; }
    .plaque.crit {
      filter: drop-shadow(0 0 7cqw rgba(255, 190, 0, 0.6)) drop-shadow(0 12px 40px rgba(0, 0, 0, 0.5));
    }
    .plaque.fumble {
      filter: drop-shadow(0 0 6cqw rgba(255, 60, 40, 0.45)) drop-shadow(0 12px 40px rgba(0, 0, 0, 0.5));
    }
    .plaque.fumble.show { animation: shake 0.5s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)}
      40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)} }
    /* total "bump" when modifiers slam into the raw result */
    @keyframes totalBump { 0%{transform:scale(1)} 35%{transform:scale(1.3)} 100%{transform:scale(1)} }
    .zone[data-id="total"] .zc.bump { animation: totalBump .42s cubic-bezier(.2,.8,.2,1); }

    #status { position: fixed; top: 6px; left: 8px; z-index: 3; font-size: 11px; color: #888;
      font-family: monospace; opacity: 0.5; }
    /* Test button: roll a random plaque + dice + result. Auto-fades when the mouse is
       idle (3s) so it never shows on a static stream — move the mouse to bring it back. */
    #testbtn { position: fixed; left: 12px; bottom: 12px; z-index: 5; font-family: 'Cinzel', serif;
      font-size: 13px; font-weight: 700; color: #2a1d00; cursor: pointer; border: 0;
      padding: 9px 14px; border-radius: 10px; background: linear-gradient(180deg, #ffdf72, #ffd24a);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .45); opacity: .9;
      transition: opacity .45s ease, transform .08s ease; }
    #testbtn:hover { opacity: 1; }
    #testbtn:active { transform: translateY(1px); }
    #testbtn.idle { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="dice"></div>
  <div id="stage"></div>
  <div id="status">connecting…</div>
  <button id="testbtn" type="button" hidden>🎲 Test roll</button>

  <!-- Single shared three (r182), vendored local-first. The dice engine bundle is
       built with three externalized, so it resolves this bare `three` specifier;
       keeping it local (not a CDN) preserves the overlay's CDN-outage resilience.
       The CDN engine fallback bundles its own three and ignores this map. -->
  <script type="importmap">
  { "imports": { "three": "/assets/three/three.module.js" } }
  </script>

  <script type="module">
  /* ─────────────────────────────────────────────────────────────────────────
     OVERLAY CONFIG — the DEFAULT dice look (used when a roll carries no per-player
     style). Per-player styles are set on the customize page and arrive on each roll
     as `roll.style`; styleToConfig() below maps them onto the engine.
     Materials: "glass" (translucent), "plastic", "metal", "wood", "none".
     Textures/colorsets: see /assets/dice-manifest.json (built-ins + your custom ones).
     ───────────────────────────────────────────────────────────────────────── */
  const CONFIG = {
    enable3d: true,            // master switch; falls back to the plaque-only overlay if false/unavailable
    theme_material: 'glass',   // translucent dice by default
    theme_texture: 'marble',   // surface texture
    theme_colorset: 'white',   // base color palette
    scale: 100,                // dice size (baseScale)
    strength: 1.6,             // toss strength
    shadows: true,
    displayMs: 4200,           // how long the result plaque stays up
    settleTimeoutMs: 6000,     // safety: proceed even if physics never reports done
  };

  // Assets are served locally from /assets/ (vendored). The dice engine + confetti
  // load local-first and fall back to the CDN only if the local copy is missing —
  // so a CDN outage never breaks the overlay. (Custom textures only exist in the
  // locally-built bundle; the CDN fallback gives built-in textures only.)
  const ASSET_PATH = '/assets/';
  const LOCAL_ENGINE = '/assets/dice-box/dice-box.bundle.js';
  // Fallback = our own fork's built artifact, served from a pinned git tag via jsdelivr /gh
  // (upstream @3d-dice is unmaintained). Its dist externalizes three → resolved by the
  // import map above; assetPath below uses the fork's vendored public/ textures.
  const CDN = 'https://cdn.jsdelivr.net/gh/ankorio/dice-box-threejs@v0.1.3';
  const SUPPORTED_SIDES = new Set([4, 6, 8, 10, 12, 20, 100]);

  const params = new URLSearchParams(location.search);
  const room = (location.pathname.match(/\/room\/([^/]+)\//) || [])[1] || params.get('room');
  const wantPlayer = params.get('player');     // per-player overlay filter
  const DEMO = params.get('demo');             // landing-page demo: parent drives rolls via postMessage
  const statusEl = document.getElementById('status');
  const stage = document.getElementById('stage');
  const I18N = {
    en: {
      adv: 'Advantage',
      dis: 'Disadvantage',
      crit: 'Critical hit!',
      fumble: 'Fumble',
      someone: 'Someone',
      statusConnecting: 'connecting…',
      statusLive: 'live',
      statusMissingRoom: 'missing room id',
      statusReconnecting: 'reconnecting…',
      previewWho: 'Preview',
      previewCheck: 'Check',
      previewAttack: 'Fire Bolt',
    },
    es: {
      adv: 'Ventaja',
      dis: 'Desventaja',
      crit: '¡Crítico!',
      fumble: 'Pifia',
      someone: 'Alguien',
      statusConnecting: 'conectando…',
      statusLive: 'en directo',
      statusMissingRoom: 'falta el id de la sala',
      statusReconnecting: 'reconectando…',
      previewWho: 'Vista previa',
      previewCheck: 'Prueba',
      previewAttack: 'Rayo de fuego',
    },
  };
  function detectLang() {
    let saved = '';
    try { saved = localStorage.getItem('ovr_lang') || localStorage.getItem('br_lang') || ''; } catch {}
    if (saved === 'en' || saved === 'es') return saved;
    return (navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en';
  }
  const lang = detectLang();
  const t = (key) => ((I18N[lang] || I18N.en)[key] || I18N.en[key] || key);
  document.documentElement.lang = lang;
  if (statusEl) statusEl.textContent = t('statusConnecting');

  // ── optional libraries (3D dice + particles), loaded with graceful fallback ──
  let Box = null;       // dice-box-threejs instance, or null → plaque-only
  let confetti = null;  // canvas-confetti, or null → no particles
  let Director = null;  // result-VFX director (crit/fumble/disadvantage), or null → no FX

  // Import a module local-first, falling back to the CDN URL if the local copy fails.
  // Returns { mod, usedCdn } so callers can adjust paths (e.g. assetPath) accordingly.
  async function importLocalFirst(localUrl, cdnUrl, label) {
    try { return { mod: await import(localUrl), usedCdn: false }; }
    catch (e) {
      console.warn(`[overlay] local ${label} unavailable, trying CDN`, e);
      return { mod: await import(cdnUrl), usedCdn: true };
    }
  }

  async function initDice() {
    if (!CONFIG.enable3d) return;
    try {
      const { mod, usedCdn } = await importLocalFirst(LOCAL_ENGINE, `${CDN}/dist/dice-box-threejs.es.js`, 'dice engine');
      const DiceBox = mod.default;
      Box = new DiceBox('#dice', {
        // Local assetPath with the local engine; CDN public/ if we fell back.
        assetPath: usedCdn ? `${CDN}/public/` : ASSET_PATH,
        sounds: false,
        shadows: CONFIG.shadows,
        baseScale: CONFIG.scale,
        strength: CONFIG.strength,
        theme_material: CONFIG.theme_material,
        theme_texture: CONFIG.theme_texture,
        theme_colorset: CONFIG.theme_colorset,
      });
      await Box.initialize();
      console.log('[overlay] 3D dice ready');
    } catch (e) {
      Box = null;
      console.warn('[overlay] 3D dice unavailable — using plaque-only overlay', e);
    }
  }
  async function initConfetti() {
    try { const mod = await import('https://esm.sh/canvas-confetti@1.9.3'); confetti = mod.default; } catch {}
  }

  // Map a per-player style (from roll.style) onto dice-box-threejs config. With custom
  // colors we use theme_customColorset (which also carries texture+material); otherwise
  // a named colorset + texture + material. Missing fields fall back to CONFIG defaults.
  function styleToConfig(style) {
    const s = style || {};
    const texture = s.texture != null ? s.texture : CONFIG.theme_texture;
    const material = s.material != null ? s.material : CONFIG.theme_material;
    const hasCustomColors = s.foreground || s.background || s.edge;
    if (hasCustomColors) {
      return {
        theme_texture: texture,
        theme_material: material,
        theme_customColorset: {
          foreground: s.foreground || '#ffffff',
          background: s.background || s.foreground || '#cccccc',
          outline: s.edge || s.background || 'black',
          edge: s.edge || s.background || '',
          texture,
          material,
        },
      };
    }
    return {
      theme_customColorset: null,
      theme_colorset: s.colorset || CONFIG.theme_colorset,
      theme_texture: texture,
      theme_material: material,
    };
  }

  // ── per-style colorData cache ────────────────────────────────────────────────
  // Resolving a style runs the engine's ImageLoader (loads the texture image) and
  // produces a `colorData` object. With concurrent rolls each die group carries its
  // OWN colorData (so different players' dice keep distinct looks at the same time),
  // so we resolve once per distinct style and cache it — repeat rolls reuse it, and
  // the overlay pre-warms every known player's style on connect. The engine no longer
  // needs a global "current theme"; colorData is passed straight to Box.rollGroup.
  const colorCache = new Map();        // styleKey -> resolved colorData (or a pending Promise)
  const STYLE_CACHE_MAX = 64;
  function styleKey(style) {
    const s = style || {};
    return JSON.stringify([s.texture || '', s.material || '', s.colorset || '',
      s.foreground || '', s.background || '', s.edge || '']);
  }

  // Map a per-player style to the engine's theme shape ({ colorset | customColorset,
  // texture, material }) via the existing styleToConfig().
  function themeFromStyle(style) {
    const c = styleToConfig(style);
    if (c.theme_customColorset) return { customColorset: c.theme_customColorset, texture: c.theme_texture, material: c.theme_material };
    return { colorset: c.theme_colorset, texture: c.theme_texture, material: c.theme_material };
  }

  // Resolve (and cache) a style's colorData. Returns a Promise; concurrent callers
  // for the same style share the in-flight resolve. Fast path: a cache hit resolves
  // instantly with the stored colorData (no network, no re-resolve).
  function resolveStyle(style) {
    if (!Box) return Promise.resolve(null);
    const key = styleKey(style);
    const hit = colorCache.get(key);
    if (hit) return Promise.resolve(hit).then((cd) => { colorCache.set(key, cd); return cd; });
    const p = Box.resolveColorData(themeFromStyle(style))
      .then((cd) => { colorCache.set(key, cd); while (colorCache.size > STYLE_CACHE_MAX) colorCache.delete(colorCache.keys().next().value); return cd; })
      .catch((e) => { console.warn('[overlay] style resolve failed', e); colorCache.delete(key); return null; });
    colorCache.set(key, p);
    return p;
  }

  // Pre-load (and re-load on change) every known player's dice textures so the first
  // roll for each player is instant. Polls /styles; prunes cache to the current set.
  let lastStylesJson = '';
  async function warmStyles() {
    if (!Box || !room) return;
    try {
      const r = await fetch('/room/' + room + '/styles');
      if (!r.ok) return;
      const txt = await r.text();
      if (txt === lastStylesJson) return;       // unchanged since last poll
      lastStylesJson = txt;
      const d = JSON.parse(txt);
      const styles = [d.defaultStyle, ...Object.values(d.styles || {})].filter(Boolean);
      const keep = new Set([styleKey(null), ...styles.map(styleKey)]);
      for (const k of [...colorCache.keys()]) if (!keep.has(k)) colorCache.delete(k); // drop updated/removed
      for (const s of styles) if (!colorCache.has(styleKey(s))) await resolveStyle(s);  // warm new ones
    } catch {}
  }

  // ── notation builder: turn parsed dice into a PREDETERMINED roll string ──────
  // e.g. [{sides:'20',value:13}] → "1d20@13";  two d20s → "2d20@13,8".
  function notationFromDice(dice) {
    const groups = new Map(); // sides -> [values] (preserves a stable term order)
    for (const d of dice) {
      const s = Number(d.sides);
      if (!SUPPORTED_SIDES.has(s) || !Number.isFinite(Number(d.value))) continue;
      if (!groups.has(s)) groups.set(s, []);
      groups.get(s).push(Number(d.value));
    }
    if (!groups.size) return null;
    const terms = [], values = [];
    for (const [sides, vals] of groups) { terms.push(`${vals.length}d${sides}`); values.push(...vals); }
    return `${terms.join('+')}@${values.join(',')}`;
  }

  // What dice to physically roll for this event. Advantage/disadvantage rolls
  // BOTH d20s (so you see the pair) and we mark which one won.
  function rollPlan(roll) {
    if ((roll.mode === 'advantage' || roll.mode === 'disadvantage') &&
        roll.d20 && Array.isArray(roll.d20.values) && roll.d20.values.length === 2) {
      const [a, b] = roll.d20.values.map(Number);
      return { notation: `2d20@${a},${b}`, pair: { a, b, kept: roll.d20.keptIndex === 1 ? b : a, keptIndex: roll.d20.keptIndex } };
    }
    return { notation: notationFromDice(roll.dice || []), pair: null };
  }

  // ── plaque result card ─────────────────────────────────────────────────────
  const fmtMod = (m) => (m > 0 ? `+ ${m}` : m < 0 ? `− ${Math.abs(m)}` : '');

  // Split "Fire Bolt: 1d20 + 7" → { name:"Fire Bolt", expr:"1d20 + 7" }.
  function splitFormula(f) {
    const s = (f || '').trim();
    const i = s.indexOf(':');
    if (i > 0) return { name: s.slice(0, i).trim(), expr: s.slice(i + 1).trim() };
    return { name: '', expr: s };
  }
  // Initials for the portrait placeholder when no avatar is available.
  function initials(name) {
    const parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  // Stable hue per name so the placeholder colour is consistent for a given player.
  function hueFor(s) { let h = 0; for (const c of (s || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

  // Render the coloured initials disc (the portrait fallback). Replaces any <img>.
  function setInitials(portrait, who) {
    portrait.classList.add('placeholder');
    portrait.style.setProperty('--hue', hueFor(who));
    portrait.textContent = initials(who);
  }

  function buildBreakdown(roll, plan) {
    if (plan && plan.pair) {
      const { a, b, keptIndex } = plan.pair;
      const aCls = keptIndex === 0 ? 'keep' : 'drop';
      const bCls = keptIndex === 1 ? 'keep' : 'drop';
      const mod = roll.modifier ? ` <span class="mod">${fmtMod(roll.modifier)}</span>` : '';
      return `<span class="${aCls}">${a}</span> · <span class="${bCls}">${b}</span>${mod}`;
    }
    const vals = (roll.dice || []).map((d) => d.value).filter((v) => Number.isFinite(Number(v)));
    if (!vals.length) return '';
    const dicePart = vals.join(' + ');
    const mod = roll.modifier ? ` <span class="mod">${fmtMod(roll.modifier)}</span>` : '';
    return `${dicePart}${mod}`;
  }

  // ── plaque config (per player) — fetched from the relay, cached + polled ────────
  // The plaque is rendered by the shared BRPlaque renderer from the player's saved
  // config (template/art, zones, colors, background), so it matches the customizer.
  const templatesById = {};                     // templateId -> { id, art, colors, zones }
  const plaqueCache = { plaques: {}, defaultPlaque: null };
  let lastPlaqueJson = '';
  // Hardcoded fallback so the plaque renders even with no relay (DEMO) or before fetch.
  const BUILTIN_PLAQUE = {
    templateId: 'arcane', art: '/assets/plaque_templates/arcane-plaque.png',
    colors: { accent: '#ffd24a', badge: '#2e7d32', name: '#e6c87f' },
    zones: [
      { id: 'portrait',  kind: 'image', cx: 50, cy: 21.6, w: 21.5, coef: 0,     fs: 1, align: 'center', colorKey: null,     visible: true },
      { id: 'name',      kind: 'text',  cx: 50, cy: 39.8, w: 70,   coef: 0.034, fs: 1, align: 'center', colorKey: 'name',   visible: true },
      { id: 'badge',     kind: 'pill',  cx: 50, cy: 51.5, w: 0,    coef: 0.024, fs: 1, align: 'center', colorKey: 'badge',  visible: true },
      { id: 'total',     kind: 'text',  cx: 50, cy: 62.8, w: 50,   coef: 0.205, fs: 1, align: 'center', colorKey: 'accent', visible: true },
      { id: 'rname',     kind: 'text',  cx: 50, cy: 75.0, w: 82,   coef: 0.041, fs: 1, align: 'center', colorKey: 'accent', visible: true },
      { id: 'breakdown', kind: 'text',  cx: 50, cy: 83.2, w: 60,   coef: 0.031, fs: 1, align: 'center', colorKey: 'name',   visible: true },
      { id: 'tag',       kind: 'pill',  cx: 50, cy: 91.2, w: 0,    coef: 0.028, fs: 1, align: 'center', colorKey: 'accent', visible: true },
    ],
  };
  async function loadTemplates() {
    if (!room) return;
    try { const r = await fetch('/room/' + room + '/templates'); if (!r.ok) return;
      const d = await r.json(); (d.templates || []).forEach((tp) => { templatesById[tp.id] = tp; }); } catch {}
  }
  async function loadPlaques() {
    if (!room) return;
    try {
      const r = await fetch('/room/' + room + '/plaque'); if (!r.ok) return;
      const txt = await r.text(); if (txt === lastPlaqueJson) return; lastPlaqueJson = txt;
      const d = JSON.parse(txt); plaqueCache.plaques = d.plaques || {}; plaqueCache.defaultPlaque = d.defaultPlaque || null;
    } catch {}
  }
  function templateArt(id) { const tp = templatesById[id]; return tp ? tp.art : (id === BUILTIN_PLAQUE.templateId ? BUILTIN_PLAQUE.art : null); }
  function plaqueConfigFor(roll) {
    if (roll && roll._plaque) return roll._plaque;   // test button: a forced random template
    const id = roll && roll.playerid;
    return (id && plaqueCache.plaques[id]) || plaqueCache.defaultPlaque ||
      templatesById.arcane && { templateId: 'arcane', colors: templatesById.arcane.colors, zones: templatesById.arcane.zones, background: null } ||
      BUILTIN_PLAQUE;
  }
  // roll → the data object BRPlaque.paint fills the zones with (same shape the editor uses).
  function rollToData(roll, plan) {
    const sf = splitFormula(roll.formula);
    return {
      total: (roll.total ?? '?'),
      breakdown: buildBreakdown(roll, plan),   // HTML (keep/dropped-die spans) — paint uses innerHTML
      name: roll.who || t('someone'),
      rname: sf.name || sf.expr || '',
      badge: roll.mode === 'advantage' ? 'advantage' : roll.mode === 'disadvantage' ? 'disadvantage' : null,
      tag: roll.isCrit ? 'crit' : roll.isFumble ? 'fumble' : null,
      cls: roll.isCrit ? 'crit' : roll.isFumble ? 'fumble' : '',
      portraitImg: roll.avatar || null,
    };
  }
  const paintDict = () => ({ adv: t('adv'), dis: t('dis'), crit_tag: t('crit'), fumble_tag: t('fumble') });

  // ── room settings (display time, confetti) — fetched + polled; hideGm/sound TBD ──
  let settings = null, lastSettingsJson = '';
  async function loadSettings() {
    if (!room) return;
    try { const r = await fetch('/room/' + room + '/settings'); if (!r.ok) return;
      const txt = await r.text(); if (txt === lastSettingsJson) return; lastSettingsJson = txt;
      settings = (JSON.parse(txt).settings) || null; } catch {}
  }
  const displayMs = () => (settings && Number.isFinite(settings.displaySeconds)) ? settings.displaySeconds * 1000 : CONFIG.displayMs;
  // Per-result VFX toggles (room settings). Absent = on; only an explicit `false` disables.
  function disabledVfx() {
    const d = new Set();
    if (settings) {
      if (settings.vfxCrit === false) d.add('crit');
      if (settings.vfxFumble === false) d.add('fumble');
      if (settings.vfxDisadvantage === false) d.add('disadvantage');
    }
    return d;
  }

  function showCard(roll, plan) {
    const cfg = plaqueConfigFor(roll);
    const zones = (cfg && cfg.zones) || [];
    const el = document.createElement('div');
    el.className = 'plaque' + (roll.isCrit ? ' crit' : roll.isFumble ? ' fumble' : '');
    el._zones = zones; // for resize recompute
    if (window.BRPlaque && zones.length) {
      BRPlaque.build(el, zones, { editable: false });
      BRPlaque.layout(el, zones);
      BRPlaque.applyArt(el, { art: templateArt(cfg.templateId), frame: cfg.frame, background: cfg.background });
      BRPlaque.applyColors(el, cfg.colors || {}, zones);
      BRPlaque.paint(el, zones, rollToData(roll, plan), paintDict());
    }
    stage.appendChild(el);
    if (window.BRPlaque && zones.length) BRPlaque.recomputeFont(el, zones); // el is in the DOM → has size
    requestAnimationFrame(() => el.classList.add('show'));
    maybeBump(el, roll);
    return el;
  }

  // When a roll has a net modifier, the plaque first shows the RAW dice result, then the
  // breakdown flies up into the total and the number bumps to the final value.
  function countUp(node, from, to, dur, onDone) {
    const start = performance.now(), diff = to - from;
    const step = (now) => {
      const k = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - k, 3); // easeOutCubic
      node.textContent = String(Math.round(from + diff * e));
      if (k < 1) requestAnimationFrame(step); else { node.textContent = String(to); if (onDone) onDone(); }
    };
    requestAnimationFrame(step);
  }
  function maybeBump(el, roll) {
    const mod = Number(roll.modifier) || 0;
    const final = Number(roll.total);
    if (!mod || !Number.isFinite(final)) return;     // nothing to bump
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const totalEl = el.querySelector('.zone[data-id="total"]');
    const totalZc = totalEl && totalEl.querySelector('.zc');
    if (!totalZc) return;
    const base = final - mod;                          // raw dice sum (before modifiers)
    totalZc.textContent = String(base);                // show the raw result first
    const bd = el.querySelector('.zone[data-id="breakdown"]');
    setTimeout(() => {
      // fly the breakdown up into the total
      if (bd && getComputedStyle(bd).display !== 'none') {
        const tr = totalEl.getBoundingClientRect(), br = bd.getBoundingClientRect();
        const dx = (tr.left + tr.width / 2) - (br.left + br.width / 2);
        const dy = (tr.top + tr.height / 2) - (br.top + br.height / 2);
        bd.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1), opacity .5s ease';
        bd.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px) scale(.55)`;
        bd.style.opacity = '0';
      }
      // count up to the final value, then pop the number
      countUp(totalZc, base, final, 480, () => {
        totalZc.classList.remove('bump'); void totalZc.offsetWidth; totalZc.classList.add('bump');
      });
    }, 650);
  }

  function fireParticles(roll) {
    if (!confetti) return;
    if (settings && settings.confetti === false) return; // room setting: critical celebration off
    if (roll.isCrit) {
      const gold = ['#ffd24a', '#ffb300', '#fff3c4', '#ffffff'];
      confetti({ particleCount: 120, spread: 80, startVelocity: 55, origin: { x: 0.5, y: 0.75 }, colors: gold });
      setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 70, origin: { x: 0, y: 0.9 }, colors: gold }), 120);
      setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 70, origin: { x: 1, y: 0.9 }, colors: gold }), 120);
    } else if (roll.isFumble) {
      confetti({ particleCount: 40, spread: 100, startVelocity: 18, gravity: 1.6, ticks: 120,
        origin: { x: 0.5, y: 0.4 }, colors: ['#ff5050', '#7a0000', '#2a0000'], scalar: 0.9 });
    }
  }

  // ── async roll tracks ─────────────────────────────────────────────────────────
  // Each roll runs its OWN lifecycle (keyed by the roll's id, so one player can have
  // two things rolling at once): dice spawn into the shared box from that player's
  // fixed edge, a plaque appears in the centered row, and after its own timer the
  // plaque fades and that die group is removed — all independent of other rolls.
  // Up to MAX_VISIBLE plaques share the screen (scaled to fit); extra rolls wait in
  // `pending` and slot in as space frees.
  const MAX_VISIBLE = 5;
  const tracks = new Map();   // roll.id -> { roll, card, timer }
  const pending = [];         // overflow rolls waiting for a free slot
  // Ids already shown — survives track teardown so a retained-roll replay (the server
  // resends `lastRoll` on every SSE (re)connect, and proxies/LBs recycle idle SSE after
  // a while) doesn't re-render as a phantom reroll. `tracks` alone can't de-dup it: the
  // track is gone by then. Bounded; ids are unique Firebase push-ids so never re-arrive.
  const seen = new Set();
  const SEEN_MAX = 256;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Stable entry edge per player (seeded by playerid → same edge across reloads).
  const SIDES = ['left', 'right', 'top', 'bottom'];
  function sideFor(playerid) { return SIDES[hueFor(playerid || '') % SIDES.length]; }

  function rollId(roll) { return roll && roll.id ? String(roll.id) : ('r' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)); }

  // Size every visible plaque so the whole centered row fits the viewport width,
  // capped at the single-plaque base height. cqw units inside the plaque scale with
  // its width, so shrinking the height (→ width via aspect-ratio) scales all content.
  const PLAQUE_ASPECT = 398 / 440;
  function relayout() {
    // Cards animating out (.leaving) are pulled from flow → exclude them so the rest
    // size and position as if the leaving plaque is already gone.
    const cards = [...stage.children].filter((el) => !el.classList.contains('leaving'));
    const n = cards.length;
    if (!n) return;
    const base = Math.min(window.innerHeight * 0.8, 560);
    const gap = window.innerWidth * 0.016;
    const avail = window.innerWidth * 0.96;
    const hByWidth = (avail - (n - 1) * gap) / n / PLAQUE_ASPECT;
    const h = Math.max(0, Math.min(base, hByWidth));
    const targetW = h * PLAQUE_ASPECT;
    stage.style.setProperty('--plaque-h', h + 'px');
    // Size zone fonts from the TARGET width so text is crisp the instant the row reflows.
    for (const el of cards) if (el._zones) sizeFonts(el, el._zones, targetW);
  }
  function sizeFonts(el, zones, plaqueW) {
    for (const z of zones) {
      if (z.kind === 'image') continue;
      const zc = el.querySelector('.zone[data-id="' + z.id + '"] .zc');
      if (zc) zc.style.fontSize = (plaqueW * z.coef * z.fs) + 'px';
    }
  }
  window.addEventListener('resize', relayout);

  // FLIP helpers: record where the shown plaques are (FIRST), and after a layout change
  // animate each from its old box to its new one (INVERT + PLAY) so the row slides
  // smoothly instead of snapping.
  function captureRects(exclude) {
    const m = new Map();
    for (const el of stage.children) {
      if (el === exclude || el.classList.contains('leaving') || !el.classList.contains('show')) continue;
      m.set(el, el.getBoundingClientRect());
    }
    return m;
  }
  function playFlip(firsts) {
    for (const el of stage.children) {
      const first = firsts.get(el);
      if (!first) continue;
      const last = el.getBoundingClientRect();
      const dx = first.left - last.left, dy = first.top - last.top;
      const ds = last.width ? first.width / last.width : 1;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(ds - 1) < 0.01) continue;
      el.style.transition = 'none';                                   // INVERT to the old box
      el.style.transform = `translate(${dx}px, ${dy}px) scale(${ds})`;
      requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = ''; }); // PLAY
    }
  }
  // Insert: a brand-new card (not in the "first" set) is skipped → it plays its own entrance.
  function reflowAround(mutate) {
    const firsts = captureRects(null);
    mutate();
    relayout();
    playFlip(firsts);
  }
  // Dismiss: the leaving plaque is pulled out of flow and animates away (it lifts, shrinks
  // and fades) while the remaining plaques immediately slide in to fill the gap.
  function dismissCard(card) {
    const firsts = captureRects(card);          // the OTHER plaques, at their current spots
    const r = card.getBoundingClientRect();
    card.style.position = 'fixed';              // pull it from flow so siblings reflow now
    card.style.left = r.left + 'px'; card.style.top = r.top + 'px';
    card.style.width = r.width + 'px'; card.style.height = r.height + 'px';
    card.style.margin = '0';
    card.classList.add('leaving');              // exit movement (CSS)
    card.classList.remove('show');
    relayout();                                 // remaining cards take the freed space…
    playFlip(firsts);                           // …and slide there smoothly
    sleep(480).then(() => card.remove());
  }

  function startRoll(roll) {
    const id = rollId(roll);
    const plan = rollPlan(roll);
    // Reserve the track now — it occupies a slot while the dice tumble. The plaque is
    // revealed only when this group SETTLES (or after a safety timeout if physics hangs),
    // so the result lands with the dice instead of before them.
    const tr = { roll, plan, card: null, timer: null };
    tracks.set(id, tr);
    if (Box && plan.notation) {
      resolveStyle(roll.style)
        .then((colorData) => Promise.race([
          Box.rollGroup({ groupId: id, notation: plan.notation, colorData, side: sideFor(roll.playerid) }),
          sleep(CONFIG.settleTimeoutMs),
        ]))
        .catch((e) => console.warn('[overlay] dice roll failed', e))
        .finally(() => revealCard(id));
    } else {
      revealCard(id);   // no 3D dice → show the plaque right away
    }
  }

  // Reveal a reserved track's plaque (on dice settle); slide siblings aside; start timer.
  function revealCard(id) {
    const tr = tracks.get(id);
    if (!tr || tr.card) return;          // ended early, or already revealed
    let card;
    reflowAround(() => { card = showCard(tr.roll, tr.plan); });
    tr.card = card;
    fireParticles(tr.roll);
    // Outcome VFX (crit→gold glow, fumble→red glow, disadvantage→mage/void). Scoped to
    // this roll's own dice via groupId; `overlay: true` excludes playground-only triggers.
    if (Box && Director) {
      try { Director.onRoll(tr.roll, { groupId: id, overlay: true, disabled: disabledVfx() }); }
      catch (e) { console.warn('[overlay] result fx failed', e); }
    }
    tr.timer = setTimeout(() => endTrack(id), displayMs());
  }

  function endTrack(id) {
    const tr = tracks.get(id);
    if (!tr) return;
    tracks.delete(id);
    if (tr.timer) clearTimeout(tr.timer);
    // pull the dice as the plaque leaves. removeGroup is async; catch its rejection too
    // (a result effect may have seized/removed a die, so the engine can throw mid-cleanup).
    if (Box) { try { const p = Box.removeGroup(id); if (p && p.catch) p.catch(() => {}); } catch {} }
    if (tr.card) dismissCard(tr.card);                 // leaving plaque animates out; row slides in
    pumpQueue();
  }

  function pumpQueue() {
    if (pending.length && tracks.size < MAX_VISIBLE) startRoll(pending.shift());
    else maybeDemoIdle();
  }

  function maybeDemoIdle() {
    if (DEMO && !tracks.size && !pending.length) {
      try { parent.postMessage({ type: 'demo-idle' }, location.origin); } catch {}
    }
  }

  function enqueue(roll) {
    const id = rollId(roll);
    if (tracks.has(id) || seen.has(id)) return;       // de-dup: live track OR already-shown (SSE retained replay)
    seen.add(id);
    if (seen.size > SEEN_MAX) seen.delete(seen.values().next().value); // drop oldest
    if (tracks.size >= MAX_VISIBLE) { pending.push(roll); return; }
    startRoll(roll);
  }

  // ── SSE ───────────────────────────────────────────────────────────────────────
  function connect() {
    if (!room) { statusEl.textContent = t('statusMissingRoom'); return; }
    const es = new EventSource('/room/' + room + '/events');
    es.onopen = () => { statusEl.textContent = t('statusLive'); };
    es.onmessage = (e) => {
      try {
        const roll = JSON.parse(e.data);
        if (wantPlayer && roll.playerid !== wantPlayer) return; // not this player's overlay
        if (roll.ts) statusEl.textContent = t('statusLive') + ' · ' + (Date.now() - roll.ts) + 'ms';
        console.log('[overlay] roll received:', roll.who, roll.formula, '=', roll.total,
          roll.mode && roll.mode !== 'normal' ? '(' + roll.mode + ')' : '', roll.isCrit ? '[CRIT]' : roll.isFumble ? '[FUMBLE]' : '', roll);
        enqueue(roll);
      } catch {}
    };
    es.onerror = () => { statusEl.textContent = t('statusReconnecting'); };
  }

  // ── test/demo look pool ──────────────────────────────────────────────────────
  // Building a brand-new dice look is expensive and synchronous: DiceFactory bakes a
  // canvas + GPU texture per face (~21 for a d20), keyed by colors+texture, so a never-
  // seen style is a guaranteed cache miss → main-thread freeze. Both the overlay's Test
  // button and the landing-page demo therefore reuse SIX fixed (dice, plaque) pairs that
  // we pre-bake while idle; each throw picks a random pair (and a random result), so it's
  // always a cache hit. Shared here so both modes use the same pool + pre-bake.
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  // HSL→hex so each random dice palette stays coherent: light numbers, saturated body, dark edge.
  function hslHex(h, s, l) {
    s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
      : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    const hx = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + hx(r) + hx(g) + hx(b);
  }
  const TEST_TEX = ['marble', 'fire', 'ice', 'metal', 'stars', 'astral', 'glitter', 'dragon', 'water', 'speckles', 'stainedglass', 'none'];
  const TEST_MAT = ['glass', 'metal', 'plastic', 'wood', 'none'];
  function randomDiceStyle() {
    const h = randInt(0, 359);
    return {
      texture: pick(TEST_TEX),
      material: pick(TEST_MAT),
      foreground: hslHex((h + randInt(20, 40)) % 360, 70, 85),
      background: hslHex(h, randInt(55, 80), randInt(28, 45)),
      edge: hslHex(h, 50, 12),
    };
  }
  // A random plaque template from whatever's loaded; null → the default/builtin plaque
  // (e.g. before /templates lands, or running without a room).
  function randomTemplate() {
    const ids = Object.keys(templatesById);
    if (!ids.length) return null;
    const tp = templatesById[pick(ids)];
    return { templateId: tp.id, colors: tp.colors, zones: tp.zones, background: null };
  }
  const TEST_PAIRS = 6;
  let testPairs = [];
  function buildTestPairs() {
    testPairs = Array.from({ length: TEST_PAIRS }, () => ({ style: randomDiceStyle(), plaque: randomTemplate() }));
  }
  // A precached pair (cache hit, no freeze); a fresh one only if the pool isn't ready yet.
  const pickPair = () => testPairs.length ? pick(testPairs) : { style: randomDiceStyle(), plaque: randomTemplate() };
  const nextFrame = () => new Promise((r) => (window.requestAnimationFrame ? requestAnimationFrame(() => r()) : setTimeout(r, 0)));
  // Pre-bake one style's d20 face textures into the engine's material cache. Mirrors what
  // rollGroup does (resolve colorData → applyColorSet → create a d20) minus the scene
  // insertion, so the cachestring matches and the first real throw is a cache hit. The
  // discarded mesh is GC'd; geometry/material caches persist on the factory.
  async function prebakeStyle(style) {
    if (!Box) return;
    const colorData = await resolveStyle(style);   // warms texture image + colorset
    const F = Box.DiceFactory;
    if (!colorData || !F || typeof F.create !== 'function') return;
    try { F.applyColorSet(colorData); F.create('d20'); } catch (e) { console.warn('[overlay] prebake failed', e); }
  }
  // Bake all six looks, yielding a frame between each so load stays smooth.
  async function precacheTestPairs() { for (const p of testPairs) { await prebakeStyle(p.style); await nextFrame(); } }

  // ── boot ────────────────────────────────────────────────────────────────────
  await Promise.allSettled([initDice(), initConfetti()]);

  // Result-VFX layer (only with 3D dice). Local-first dynamic import mirrors the dice
  // engine: a module failure degrades to plaque + dice + confetti, never breaks the overlay.
  // The trailing-trail + collision effects (MotionFX/SpriteFX) stay playground-only.
  if (Box) {
    try {
      Director = (await import('/assets/fx/director/index.js')).default;
      Director.attach(Box);   // wires BRFX (warms its procedural/Kenney textures) + the Conductor
      // Warm heavy assets (Wizard.glb, atlases, the void-dome Fresnel shader) on idle so the
      // first real trigger never stalls mid-roll.
      (window.requestIdleCallback || ((f) => setTimeout(f, 1500)))(() => Director.warmup(Box));
      console.log('[overlay] result FX ready');
    } catch (e) {
      console.warn('[overlay] FX layer unavailable', e);
      Director = null;
    }
  }

  // Plaque configs + templates + room settings (cached; polled so edits land without a reload).
  if (room) {
    loadTemplates(); loadPlaques(); loadSettings();
    setInterval(() => { loadPlaques(); loadSettings(); }, 15000);
  }
  // (Zone fonts + plaque sizing on resize are handled by relayout(), registered above.)

  // Build the six-look pool (test button + demo) once templates load — they seed the
  // plaques — then pre-bake every look so the first throw of each never stalls the thread.
  buildTestPairs();
  if (Box) (async () => { try { await loadTemplates(); } catch {} buildTestPairs(); precacheTestPairs(); })();

  if (DEMO) {
    // Embedded on the landing page: no room/SSE. The parent page sends rolls via
    // postMessage and we render them through the real pipeline (3D dice + plaque
    // + particles), reporting ready/idle so it can drive buttons + auto-play. We stamp a
    // random precached (dice, plaque) pair onto each roll the parent sends (unless it set
    // its own), so the demo shows varied dice + frames without ever freezing.
    statusEl.style.display = 'none';
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (!(e.data && e.data.type === 'demo-roll' && e.data.roll)) return;
      const roll = e.data.roll;
      if (!roll.style) { const p = pickPair(); roll.style = p.style; if (p.plaque) roll._plaque = p.plaque; }
      enqueue(roll);
    });
    try { parent.postMessage({ type: 'demo-ready' }, location.origin); } catch {}
  } else {
    connect();
    // Pre-warm every known player's dice textures now, then poll so a style edited on
    // the customize page gets re-cached without waiting for that player's next roll.
    if (Box && room) {
      warmStyles();
      setInterval(warmStyles, 15000);
    }
  }

  // ── preview: press keys in a normal tab to test (no Roll20 needed) ───────────
  //   T = normal d20   A = advantage   D = disadvantage   C = crit   F = fumble
  let n = 0;
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (!'tadcf'.includes(k)) return;
    n++;
    const d20 = (v) => ({ sides: '20', value: v, crit: v === 20, fumble: v === 1 });
    if (k === 'a' || k === 'd') {
      const a = 4 + (n * 7) % 17, b = 2 + (n * 11) % 18;
      const kept = k === 'a' ? Math.max(a, b) : Math.min(a, b);
      enqueue({ id: 'k' + n, who: t('previewWho'), formula: `${t('previewCheck')}: 1d20 + 5`, total: kept + 5, modifier: 5,
        mode: k === 'a' ? 'advantage' : 'disadvantage', d20: { values: [a, b], keptIndex: (k === 'a' ? (a >= b ? 0 : 1) : (a <= b ? 0 : 1)) },
        dice: [d20(kept)], isCrit: kept === 20, isFumble: kept === 1, ts: Date.now() });
    } else {
      const v = k === 'c' ? 20 : k === 'f' ? 1 : 2 + (n % 18);
      enqueue({ id: 'k' + n, who: t('previewWho'), formula: `${t('previewAttack')}: 1d20 + 7`, total: v + 7, modifier: 7,
        mode: 'normal', d20: null, dice: [d20(v)], isCrit: v === 20, isFumble: v === 1, ts: Date.now() });
    }
  });

  // ── test button: random template + random dice look + random event/result ────
  // Each click builds one complete roll and runs it through the real pipeline (3D
  // dice + plaque + particles). Hidden in the landing-page demo; the button auto-fades
  // when the mouse is idle so it never lands on a static OBS stream.
  if (!DEMO) {
    const testBtn = document.getElementById('testbtn');
    testBtn.hidden = false;

    // Look pool (six precached dice+plaque pairs) + helpers are shared above; here we only
    // add the test-roll's random who/result on top of a picked pair.
    const TEST_WHO = ['Seraphina', 'Thorne', 'Lyra', 'Grimm', 'Vesper', 'Kael', 'Mara', 'Orin', 'Sable', 'Quill'];
    const TEST_RNAME = ['Longsword Attack', 'Fire Bolt', 'Stealth Check', 'Perception', 'Wisdom Save', 'Eldritch Blast', 'Sacred Flame', 'Arcana', 'Athletics', 'Initiative'];

    let testN = 0;
    function randomTestRoll() {
      testN++;
      // Weight toward normal; adv/dis roll two d20s, crit/fumble force 20/1.
      const ev = pick(['normal', 'normal', 'normal', 'advantage', 'disadvantage', 'crit', 'fumble']);
      const mod = randInt(0, 9);
      const d20 = (v) => ({ sides: '20', value: v, crit: v === 20, fumble: v === 1 });
      const pair = pickPair();   // precached look (cache hit, no freeze)
      const base = {
        id: 'test' + testN + '_' + Math.random().toString(36).slice(2, 6),
        who: pick(TEST_WHO), style: pair.style, ts: Date.now(),
      };
      if (pair.plaque) base._plaque = pair.plaque;
      const rname = pick(TEST_RNAME);
      if (ev === 'advantage' || ev === 'disadvantage') {
        const a = randInt(1, 20), b = randInt(1, 20), adv = ev === 'advantage';
        const kept = adv ? Math.max(a, b) : Math.min(a, b);
        return { ...base, formula: `${rname}: 1d20 + ${mod}`, total: kept + mod, modifier: mod, mode: ev,
          d20: { values: [a, b], keptIndex: adv ? (a >= b ? 0 : 1) : (a <= b ? 0 : 1) },
          dice: [d20(kept)], isCrit: kept === 20, isFumble: kept === 1 };
      }
      const v = ev === 'crit' ? 20 : ev === 'fumble' ? 1 : randInt(1, 20);
      return { ...base, formula: `${rname}: 1d20 + ${mod}`, total: v + mod, modifier: mod, mode: 'normal',
        d20: null, dice: [d20(v)], isCrit: v === 20, isFumble: v === 1 };
    }
    testBtn.addEventListener('click', () => enqueue(randomTestRoll()));

    // Auto-fade when the mouse is idle (kept clickable while you're interacting).
    let idleT = null;
    const wake = () => { testBtn.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => testBtn.classList.add('idle'), 3000); };
    ['mousemove', 'pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, wake));
    wake();
  }
  </script>
</body>
</html>
